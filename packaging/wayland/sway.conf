# Taiji kiosk config for sway.
# One visible workspace at a time: taiji / app / music.
xwayland enable
output * bg #05070C solid_color
bar {
    mode invisible
}
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
smart_gaps off
focus_follows_mouse no
mouse_warping none
workspace_layout default
seat seat0 hide_cursor 1

# The session loop starts Taiji on the taiji workspace.
workspace taiji
exec /usr/libexec/taiji/taiji-session-loop

# Keyboard fallback for the controller Guide/Home button. taiji-hotkeyd is the
# primary path; this binding is here so a keyboard can still return.
set $mod Mod4
bindsym $mod+Home exec /usr/libexec/taiji/taiji-return
bindsym $mod+XF86HomePage exec /usr/libexec/taiji/taiji-return
bindsym Home exec /usr/libexec/taiji/taiji-return
bindsym XF86HomePage exec /usr/libexec/taiji/taiji-return

# Keyboard fallback for the multitask overview (controller Guide long press).
bindsym $mod+Shift+Home exec /usr/libexec/taiji/taiji-overview

# Volume keys are handled by Taiji through signals, so the app can show its
# volume card and keep system volume in sync.
bindsym XF86AudioRaiseVolume exec pkill -USR1 -x taiji
bindsym XF86AudioLowerVolume exec pkill -USR2 -x taiji
bindsym XF86AudioMute exec pkill -HUP -x taiji
